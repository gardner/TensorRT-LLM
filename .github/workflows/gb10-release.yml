name: GB10 Release

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "GitHub release tag. Defaults to gb10-trtllm-v<sha>."
        required: false
        type: string
      image-name:
        description: "Container image name. Defaults to ghcr.io/<owner>/tensorrt-llm-gb10."
        required: false
        type: string
      base-tag:
        description: "NVIDIA PyTorch base tag."
        required: false
        default: "26.02-py3"
        type: string
      triton-base-tag:
        description: "NVIDIA Triton base tag."
        required: false
        default: "26.02-py3"
        type: string
      cuda-archs:
        description: "CMake CUDA architectures for the GB10 build."
        required: false
        default: "121-real"
        type: string
      push-image:
        description: "Push the release image to GHCR."
        required: false
        default: true
        type: boolean
      publish-release:
        description: "Upload the wheel and image reference to a GitHub release."
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "gb10-trtllm-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: gb10-trtllm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      image_name: ${{ steps.meta.outputs.image_name }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      base_tag: ${{ steps.meta.outputs.base_tag }}
      triton_base_tag: ${{ steps.meta.outputs.triton_base_tag }}
      cuda_archs: ${{ steps.meta.outputs.cuda_archs }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs['release-tag'] || '' }}
          INPUT_IMAGE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs['image-name'] || '' }}
          INPUT_BASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs['base-tag'] || '26.02-py3' }}
          INPUT_TRITON_BASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs['triton-base-tag'] || '26.02-py3' }}
          INPUT_CUDA_ARCHS: ${{ github.event_name == 'workflow_dispatch' && inputs['cuda-archs'] || '121-real' }}
        run: |
          set -euo pipefail
          release_tag="${INPUT_RELEASE_TAG}"
          if [ -z "${release_tag}" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "${release_tag}" ]; then
            release_tag="gb10-trtllm-v$(git rev-parse --short HEAD)"
          fi

          image_name="${INPUT_IMAGE_NAME}"
          if [ -z "${image_name}" ]; then
            owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
            image_name="ghcr.io/${owner}/tensorrt-llm-gb10"
          fi
          image_tag="${release_tag#gb10-trtllm-}"
          image_ref="${image_name}:${image_tag}"

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "image_name=${image_name}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "base_tag=${INPUT_BASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "triton_base_tag=${INPUT_TRITON_BASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "cuda_archs=${INPUT_CUDA_ARCHS}" >> "${GITHUB_OUTPUT}"

  build:
    needs: setup
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      BUILD_WHEEL_ARGS: --clean --benchmarks --generate_fmha --cuda_architectures=${{ needs.setup.outputs.cuda_archs }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' || inputs['push-image'] == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build wheel export
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.multi
          target: wheel-export
          platforms: linux/arm64
          pull: true
          push: false
          outputs: type=local,dest=dist
          build-args: |
            BASE_TAG=${{ needs.setup.outputs.base_tag }}
            TRITON_BASE_TAG=${{ needs.setup.outputs.triton_base_tag }}
            BUILD_WHEEL_ARGS=${{ env.BUILD_WHEEL_ARGS }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=gb10-trtllm
          cache-to: type=gha,mode=max,scope=gb10-trtllm
          provenance: false
          sbom: false

      - name: Record wheel and image metadata
        run: |
          set -euo pipefail
          test -n "$(find dist -maxdepth 1 -name 'tensorrt_llm*.whl' -print -quit)"
          echo "${{ needs.setup.outputs.image_ref }}" > dist/image-ref.txt
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: trtllm-gb10-wheel
          path: |
            dist/tensorrt_llm*.whl
            dist/image-ref.txt

      - name: Build and optionally push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.multi
          target: release
          platforms: linux/arm64
          pull: true
          push: ${{ github.event_name == 'push' || inputs['push-image'] == true }}
          tags: ${{ needs.setup.outputs.image_ref }}
          build-args: |
            BASE_TAG=${{ needs.setup.outputs.base_tag }}
            TRITON_BASE_TAG=${{ needs.setup.outputs.triton_base_tag }}
            BUILD_WHEEL_ARGS=${{ env.BUILD_WHEEL_ARGS }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=gb10-trtllm
          cache-to: type=gha,mode=max,scope=gb10-trtllm
          provenance: false
          sbom: false

  publish:
    needs: [setup, build]
    if: github.event_name == 'push' || inputs['publish-release'] == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: trtllm-gb10-wheel
          path: dist

      - name: Upload wheel to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes "GB10 Spark TensorRT-LLM release with native SM121A wheel and container image." \
              --prerelease
          fi
          gh release upload "${RELEASE_TAG}" dist/* --clobber
